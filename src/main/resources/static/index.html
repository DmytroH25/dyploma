<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECC-шифрування команд управління</title>
    <link rel="stylesheet" href="/styles.css?v=20260623" />
    <script>
      window.addEventListener("error", function (event) {
        var box = document.getElementById("boot-error");
        if (box) {
          box.style.display = "block";
          box.textContent = "Помилка запуску інтерфейсу: " + event.message;
        }
      });
      window.addEventListener("unhandledrejection", function (event) {
        var box = document.getElementById("boot-error");
        if (box) {
          box.style.display = "block";
          box.textContent = "Помилка запиту: " + (event.reason && event.reason.message ? event.reason.message : event.reason);
        }
      });
    </script>
    <script src="/vendor/react.development.js?v=20260623"></script>
    <script src="/vendor/react-dom.development.js?v=20260623"></script>
  </head>
  <body>
    <div id="boot-error" style="display:none;margin:24px;padding:16px;border:1px solid #dc6b6b;border-radius:8px;color:#8f1d1d;background:#fff1f1;font-family:Segoe UI,system-ui,sans-serif;font-weight:700;"></div>
    <div id="root" style="margin:24px;font-family:Segoe UI,system-ui,sans-serif;">Завантаження інтерфейсу...</div>
    <script src="/app.compiled.js?v=20260623"></script>
  </body>
</html>
